<svg xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="280"
    viewBox="0 0 1200 280"
    role="img"
    aria-label="Desenvolvedor Full Stack">

    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#07111f"/>
            <stop offset="100%" stop-color="#0d2940"/>
        </linearGradient>

        <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.08"/>
        </linearGradient>

        <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
            <path
                d="M 34 0 L 0 0 0 34"
                fill="none"
                stroke="#38bdf8"
                stroke-width="1"
                stroke-opacity="0.045"/>
        </pattern>
    </defs>

    <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
    <rect x="730" width="470" height="280" rx="18" fill="url(#glow)"/>
    <rect x="730" width="470" height="280" rx="18" fill="url(#grid)"/>

    <text
        x="64"
        y="112"
        fill="#f8fafc"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="700">
        DESENVOLVEDOR FULL STACK
    </text>

    <text
        x="66"
        y="158"
        fill="#b9c9d8"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="22">
        TypeScript • React • Go • PostgreSQL • Docker • Linux
    </text>

    <rect x="66" y="184" width="148" height="4" rx="2" fill="#38bdf8"/>

    <!-- painel técnico minimalista -->
    <g transform="translate(805 56)">
        <line x1="18" y1="26" x2="18" y2="156"
              stroke="#38bdf8" stroke-width="2" stroke-opacity="0.35"/>

        <g transform="translate(0 0)">
            <circle cx="18" cy="26" r="6" fill="#38bdf8"/>
            <rect x="42" y="4" width="260" height="44" rx="10"
                  fill="#0b2033" stroke="#38bdf8" stroke-opacity="0.22"/>
            <text x="60" y="23"
                  fill="#7dd3fc"
                  font-family="Inter, Arial, sans-serif"
                  font-size="11"
                  font-weight="700"
                  letter-spacing="1.2">
                FRONTEND
            </text>
            <text x="60" y="39"
                  fill="#e5eef6"
                  font-family="Inter, Arial, sans-serif"
                  font-size="14">
                React + TypeScript
            </text>
        </g>

        <g transform="translate(0 64)">
            <circle cx="18" cy="26" r="6" fill="#38bdf8"/>
            <rect x="42" y="4" width="260" height="44" rx="10"
                  fill="#0b2033" stroke="#38bdf8" stroke-opacity="0.22"/>
            <text x="60" y="23"
                  fill="#7dd3fc"
                  font-family="Inter, Arial, sans-serif"
                  font-size="11"
                  font-weight="700"
                  letter-spacing="1.2">
                BACKEND
            </text>
            <text x="60" y="39"
                  fill="#e5eef6"
                  font-family="Inter, Arial, sans-serif"
                  font-size="14">
                Go + PostgreSQL
            </text>
        </g>

        <g transform="translate(0 128)">
            <circle cx="18" cy="26" r="6" fill="#38bdf8"/>
            <rect x="42" y="4" width="260" height="44" rx="10"
                  fill="#0b2033" stroke="#38bdf8" stroke-opacity="0.22"/>
            <text x="60" y="23"
                  fill="#7dd3fc"
                  font-family="Inter, Arial, sans-serif"
                  font-size="11"
                  font-weight="700"
                  letter-spacing="1.2">
                INFRA
            </text>
            <text x="60" y="39"
                  fill="#e5eef6"
                  font-family="Inter, Arial, sans-serif"
                  font-size="14">
                Docker + Linux + Nginx
            </text>
        </g>
    </g>
</svg>
